<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>2D Platformer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
    body {
      background: #111;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }
    canvas {
      display: block;
      background: #000;
      max-width: 100%;
      max-height: 100%;
    }

    /* أزرار الموبايل */
    #controls {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      pointer-events: none;
      z-index: 100;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }
    .btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      border: 3px solid rgba(255, 255, 255, 0.6);
      color: white;
      font-size: 28px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      backdrop-filter: blur(4px);
      -webkit-user-select: none;
    }
    .btn:active, .btn.active {
      background: rgba(255, 255, 255, 0.5);
      transform: scale(0.92);
    }
    .btn-jump {
      width: 80px;
      height: 80px;
      background: rgba(76, 175, 80, 0.4);
      border-color: rgba(76, 175, 80, 0.8);
      font-size: 22px;
    }
    .btn-slide {
      width: 65px;
      height: 65px;
      background: rgba(33, 150, 243, 0.4);
      border-color: rgba(33, 150, 243, 0.8);
      font-size: 18px;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- أزرار التحكم للموبايل -->
  <div id="controls">
    <div class="btn-group">
      <div class="btn" id="btnLeft">◀</div>
      <div class="btn" id="btnRight">▶</div>
    </div>
    <div class="btn-group">
      <div class="btn btn-slide" id="btnSlide">Slide</div>
      <div class="btn btn-jump" id="btnJump">Jump</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = Math.min(window.innerWidth, 1280);
      canvas.height = Math.min(window.innerHeight, 720);
    }
    resize();
    window.addEventListener('resize', resize);

    // ========== تحميل الصور ==========
    const images = {};
    const animConfig = {
      idle:  { count: 10, speed: 0.12 },
      run:   { count: 8,  speed: 0.18 },
      jump:  { count: 12, speed: 0.15 },
      dead:  { count: 10, speed: 0.12 },
      slide: { count: 5,  speed: 0.15 }
    };

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('فشل تحميل: ' + src));
        img.src = src;
      });
    }

    async function loadAll() {
      images.bg = await loadImage('BG.png');
      images.platform = await loadImage('pl.png');

      for (const name in animConfig) {
        images[name] = [];
        const count = animConfig[name].count;
        const fileNameBase = name.charAt(0).toUpperCase() + name.slice(1);

        for (let i = 1; i <= count; i++) {
          const fileName = fileNameBase + ' (' + i + ').png';
          const img = await loadImage(fileName);
          images[name].push(img);
        }
      }
    }

    // ========== اللاعب ==========
    const player = {
      x: 100,
      y: 100,
      vx: 0,
      vy: 0,
      width: 60,
      height: 80,
      speed: 5.5,
      jumpPower: -15,
      onGround: false,
      state: 'idle',
      frame: 0,
      frameTimer: 0,
      facing: 1,
      dead: false,
      slideTimer: 0
    };

    // ========== المنصات ==========
    const platforms = [
      { x: 0, y: 620, w: 2200, h: 120 },
      { x: 300, y: 480, w: 180, h: 40 },
      { x: 550, y: 380, w: 160, h: 40 },
      { x: 800, y: 480, w: 200, h: 40 },
      { x: 1100, y: 350, w: 150, h: 40 },
      { x: 1350, y: 480, w: 220, h: 40 },
      { x: 1600, y: 300, w: 180, h: 40 },
      { x: 1900, y: 420, w: 200, h: 40 },
    ];

    // ========== التحكم ==========
    const keys = {};
    const touch = { left: false, right: false, jump: false, slide: false };

    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (['Space', 'ArrowUp', 'KeyW', 'ArrowDown'].includes(e.code)) e.preventDefault();
    });
    window.addEventListener('keyup', e => keys[e.code] = false);

    // أزرار اللمس
    function setupButton(id, key) {
      const btn = document.getElementById(id);
      const start = (e) => {
        e.preventDefault();
        touch[key] = true;
        btn.classList.add('active');
      };
      const end = (e) => {
        e.preventDefault();
        touch[key] = false;
        btn.classList.remove('active');
      };
      btn.addEventListener('touchstart', start, { passive: false });
      btn.addEventListener('touchend', end, { passive: false });
      btn.addEventListener('touchcancel', end, { passive: false });
      btn.addEventListener('mousedown', start);
      btn.addEventListener('mouseup', end);
      btn.addEventListener('mouseleave', end);
    }

    setupButton('btnLeft', 'left');
    setupButton('btnRight', 'right');
    setupButton('btnJump', 'jump');
    setupButton('btnSlide', 'slide');

    // ========== الكاميرا ==========
    const camera = { x: 0, y: 0 };

    function rectCollision(r1, r2) {
      return r1.x < r2.x + r2.w &&
             r1.x + r1.width > r2.x &&
             r1.y < r2.y + r2.h &&
             r1.y + r1.height > r2.y;
    }

    function update(dt) {
      if (player.dead) {
        player.frameTimer += dt;
        if (player.frameTimer > animConfig.dead.speed) {
          player.frameTimer = 0;
          if (player.frame < images.dead.length - 1) player.frame++;
        }
        return;
      }

      // حركة
      player.vx = 0;
      if (keys['ArrowLeft'] || keys['KeyA'] || touch.left) {
        player.vx = -player.speed;
        player.facing = -1;
      }
      if (keys['ArrowRight'] || keys['KeyD'] || touch.right) {
        player.vx = player.speed;
        player.facing = 1;
      }

      // قفز
      if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW'] || touch.jump) && player.onGround) {
        player.vy = player.jumpPower;
        player.onGround = false;
        player.state = 'jump';
        player.frame = 0;
      }

      // سلايد
      if ((keys['ArrowDown'] || keys['KeyS'] || touch.slide) && player.onGround && Math.abs(player.vx) > 0) {
        player.state = 'slide';
        player.slideTimer = 0.45;
      }

      if (player.slideTimer > 0) {
        player.slideTimer -= dt;
        player.vx *= 1.35;
      }

      // جاذبية
      player.vy += 0.65;
      if (player.vy > 18) player.vy = 18;

      player.x += player.vx;
      player.y += player.vy;

      // تصادم
      player.onGround = false;
      for (const p of platforms) {
        if (rectCollision(player, p)) {
          if (player.vy > 0 && player.y + player.height - player.vy <= p.y + 12) {
            player.y = p.y - player.height;
            player.vy = 0;
            player.onGround = true;
          } else if (player.vy < 0 && player.y - player.vy >= p.y + p.h - 12) {
            player.y = p.y + p.h;
            player.vy = 0;
          } else if (player.vx > 0) {
            player.x = p.x - player.width;
          } else if (player.vx < 0) {
            player.x = p.x + p.w;
          }
        }
      }

      // تحديد الحالة
      if (player.slideTimer > 0) {
        player.state = 'slide';
      } else if (!player.onGround) {
        player.state = 'jump';
      } else if (Math.abs(player.vx) > 0.4) {
        player.state = 'run';
      } else {
        player.state = 'idle';
      }

      // أنيميشن
      const conf = animConfig[player.state] || animConfig.idle;
      player.frameTimer += dt;
      if (player.frameTimer > conf.speed) {
        player.frameTimer = 0;
        player.frame = (player.frame + 1) % conf.count;
      }

      if (player.x < 0) player.x = 0;
      if (player.y > 1000) {
        player.dead = true;
        player.state = 'dead';
        player.frame = 0;
      }

      // كاميرا
      camera.x = player.x - canvas.width / 2 + player.width / 2;
      camera.y = player.y - canvas.height / 2 + player.height / 2;
      if (camera.x < 0) camera.x = 0;
      if (camera.y < 0) camera.y = 0;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // خلفية
      const bg = images.bg;
      const bgW = bg.width;
      const startX = Math.floor(camera.x / bgW) * bgW;
      for (let x = startX - bgW; x < camera.x + canvas.width + bgW; x += bgW) {
        ctx.drawImage(bg, x - camera.x, 0, bgW, canvas.height);
      }

      // منصات
      for (const p of platforms) {
        const tileW = images.platform.width;
        for (let tx = 0; tx < p.w; tx += tileW) {
          const drawW = Math.min(tileW, p.w - tx);
          ctx.drawImage(
            images.platform,
            0, 0, drawW, images.platform.height,
            p.x + tx - camera.x,
            p.y - camera.y,
            drawW,
            p.h
          );
        }
      }

      // لاعب
      const frames = images[player.state] || images.idle;
      const frameImg = frames[Math.min(player.frame, frames.length - 1)];

      ctx.save();
      const drawX = player.x - camera.x;
      const drawY = player.y - camera.y;

      if (player.facing === -1) {
        ctx.translate(drawX + player.width, drawY);
        ctx.scale(-1, 1);
        ctx.drawImage(frameImg, 0, 0, player.width, player.height);
      } else {
        ctx.drawImage(frameImg, drawX, drawY, player.width, player.height);
      }
      ctx.restore();
    }

    let lastTime = 0;
    function gameLoop(timestamp) {
      const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
      lastTime = timestamp;
      update(dt);
      draw();
      requestAnimationFrame(gameLoop);
    }

    // بدء
    loadAll()
      .then(() => {
        if (images.idle && images.idle[0]) {
          const ratio = images.idle[0].width / images.idle[0].height;
          player.height = 78;
          player.width = Math.round(78 * ratio);
        }
        requestAnimationFrame(gameLoop);
      })
      .catch(err => {
        ctx.fillStyle = '#fff';
        ctx.font = '18px Arial';
        ctx.fillText('خطأ في تحميل الصور:', 40, 100);
        ctx.fillText(err.message, 40, 140);
        ctx.fillText('تأكد أن كل الصور موجودة في نفس المكان', 40, 180);
      });
  </script>
</body>
</html>
